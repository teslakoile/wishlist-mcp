[project]
name = "wishlist-mcp"
version = "1.0.0"
description = "Hosted MCP server for wishlist.fit"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==3.4.7",
  "httpx==0.28.1",
  # [crypto] pulls in cryptography, which RS256 needs. AuthKit signs access
  # tokens with RS256.
  "PyJWT[crypto]==2.10.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.6.1",
  "starlette>=1.0.1",
  "uvicorn[standard]==0.40.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.5",
  "respx>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 90

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wishlist_mcp"]
